<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的歌单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景图片层（由 app.js 依据 site.json 控制） -->
  <div class="bg-image" id="bgImage" aria-hidden="true"></div>
  <div class="bg-overlay" id="bgOverlay" aria-hidden="true"></div>
  <!-- 顶部氛围光晕 -->
  <div class="glow glow-mint" aria-hidden="true"></div>
  <div class="glow glow-pink" aria-hidden="true"></div>

  <div class="container">
    <header class="header">
      <img class="avatar" src="avatar.png" alt="站点头像"
           onerror="this.style.display='none'">
      <h1 id="siteTitle">我的歌单</h1>
      <p class="subtitle" id="siteSubtitle">好听的歌都在这里</p>
    </header>

    <!-- 搜索框 -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索歌名、中文译名或歌手…" aria-label="搜索">
    </div>

    <!-- 语言筛选 -->
    <div class="filter-group" id="languageFilter" role="group" aria-label="按语言筛选">
      <!-- 按钮由 app.js 动态生成 -->
    </div>

    <!-- 工具栏：排序按钮 -->
    <div class="toolbar">
      <button id="sortArtistBtn" class="sort-btn" type="button">按歌手名排序</button>
      <span id="countInfo" class="count-info"></span>
    </div>

    <!-- 歌曲列表 -->
    <ul class="song-list" id="songList"></ul>

    <p class="empty-tip" id="emptyTip" hidden>没有找到匹配的歌曲 🎶</p>

    <footer class="footer">
      <a href="upload.html" class="admin-link">管理页入口</a>
    </footer>
  </div>

  <!-- 复制成功提示 -->
  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
