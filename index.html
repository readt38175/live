<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>芙芙的歌单</title>
  <link rel="icon" href="favicon.ico?v=3" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景图片层（由 app.js 依据 site.json 控制） -->
  <div class="bg-image" id="bgImage" aria-hidden="true"></div>
  <div class="bg-overlay" id="bgOverlay" aria-hidden="true"></div>
  <!-- 顶部氛围光晕 -->
  <div class="glow glow-mint" aria-hidden="true"></div>
  <div class="glow glow-pink" aria-hidden="true"></div>

  <div class="container">
    <header class="header">
      <img class="avatar" src="avatar.png" alt="站点头像"
           onerror="this.style.display='none'">
      <h1 id="siteTitle">芙芙的歌单</h1>
      <p class="subtitle" id="siteSubtitle">轻点歌名即可复制</p>
      <!-- 头部快捷链接：个人空间 / 直播间 -->
      <div class="header-links">
        <a class="link-btn link-space" href="https://space.bilibili.com/3707011451587316"
           target="_blank" rel="noopener" title="前往B站个人空间">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M17.8 4.6l1.6 2.6h1.9c1.4 0 2.6 1.1 2.6 2.6v9.5c0 1.4-1.2 2.6-2.6 2.6H2.7c-1.4 0-2.6-1.2-2.6-2.6V9.8c0-1.5 1.2-2.6 2.6-2.6h1.9l1.6-2.6c.5-.8 1.5-1.1 2.3-.6.8.4 1.1 1.4.7 2.2l-.8 1h7.2l-.8-1c-.5-.8-.2-1.8.6-2.2.8-.5 1.8-.2 2.4.6zM5.5 11.2c-.7 0-1.3.6-1.3 1.3v3.2c0 .7.6 1.3 1.3 1.3s1.3-.6 1.3-1.3v-3.2c0-.7-.6-1.3-1.3-1.3zm13 0c-.7 0-1.3.6-1.3 1.3v3.2c0 .7.6 1.3 1.3 1.3s1.3-.6 1.3-1.3v-3.2c0-.7-.6-1.3-1.3-1.3z"/></svg>
          个人空间
        </a>
        <a class="link-btn link-live" id="liveBtn" href="javascript:void(0)" title="直播间暂未开通">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 2c.4 0 .8.2 1 .5l2.2 2.6h4.2C20.9 5.1 22 6.2 22 7.6v11.2c0 1.4-1.1 2.5-2.6 2.5H4.6C3.1 21.3 2 20.2 2 18.8V7.6c0-1.4 1.1-2.5 2.6-2.5h4.2L11 2.5c.2-.3.6-.5 1-.5zm-3 8.1c-.8 0-1.5.7-1.5 1.5v4.8c0 .8.7 1.5 1.5 1.5h6c.8 0 1.5-.7 1.5-1.5v-4.8c0-.8-.7-1.5-1.5-1.5h-6z"/></svg>
          直播间
        </a>
      </div>
    </header>

    <!-- 吸顶哨兵：用于判断筛选区是否滚动到顶部 -->
    <div class="sticky-sentinel" id="stickySentinel" aria-hidden="true"></div>

    <!-- 吸顶区：筛选 + 搜索 + 工具栏（桌面端整体吸顶；移动端仅搜索框吸顶） -->
    <div class="sticky-area" id="stickyArea">
      <!-- 筛选栏：类型 / 语种 / 付费（下拉） -->
      <div class="filter-bar">
      <label class="filter-select">
        <span class="fs-label">类型</span>
        <select id="typeFilter" aria-label="按类型筛选"></select>
      </label>
      <label class="filter-select">
        <span class="fs-label">语种</span>
        <select id="langFilter" aria-label="按语种筛选"></select>
      </label>
      <label class="filter-select">
        <span class="fs-label">歌手</span>
        <select id="artistFilter" aria-label="按歌手筛选"></select>
      </label>
      <label class="filter-select">
        <span class="fs-label">付费</span>
        <select id="paidFilter" aria-label="按付费筛选">
          <option value="全部">全部</option>
          <option value="是">是</option>
          <option value="否">否</option>
        </select>
      </label>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索歌名、中文译名或歌手…" aria-label="搜索">
    </div>

    <!-- 工具栏：排序 / 随机一首 -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="sortArtistBtn" class="tool-btn" type="button">按歌手名排序</button>
        <button id="sortTitleBtn" class="tool-btn" type="button">按歌名排序</button>
        <button id="randomBtn" class="tool-btn tool-btn-accent" type="button">🎲 随机一首</button>
      </div>
      <span id="countInfo" class="count-info"></span>
    </div>
    </div><!-- /sticky-area -->

    <!-- 歌曲表格（小屏横向滚动） -->
    <div class="table-wrap">
      <table class="song-table">
        <thead>
          <tr>
            <th class="th-idx">#</th>
            <th>歌名</th>
            <th>歌手</th>
            <th>类型</th>
            <th>语言</th>
            <th class="th-gift">付费礼物</th>
            <th class="th-note">备注</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="songBody"></tbody>
      </table>
    </div>

    <p class="empty-tip" id="emptyTip" hidden>没有找到匹配的歌曲 🎶</p>
  </div>

  <!-- 复制成功提示 -->
  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
